<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENITH · COACH PORTAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/coach.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-deep); color: var(--silver);">

  <div id="loadingScreen" style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column;">
    <div class="brand-logo" style="color:var(--accent); font-family:var(--font-display); font-size:24px; letter-spacing:.2em; margin-bottom:16px;">ZENITH</div>
    <div style="color:var(--muted); font-size:12px; letter-spacing:.1em;">VALIDANDO SESIÓN...</div>
  </div>

  <div class="coach-shell" id="appShell" style="display:none;">
    <header class="coach-header">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="font-family:var(--font-display); font-size:20px; letter-spacing:.2em; color:var(--silver-light);">ZENITH</div>
        <div style="width:1px; height:20px; background:var(--border);"></div>
        <div id="headerTeamName" style="font-size:13px; font-weight:600; color:var(--accent);">Mi Equipo</div>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <div id="headerCoachName" style="font-size:12px; color:var(--muted);">Coach</div>
        <button class="btn btn-sm btn-ghost" id="btnLogout" style="border-color:var(--danger); color:var(--danger);">SALIR</button>
      </div>
    </header>

    <nav class="coach-nav">
      <div class="coach-nav-item active" data-view="dashboard">Mi Equipo</div>
      <div class="coach-nav-item" data-view="market">Mercado</div>
      <div class="coach-nav-item" data-view="economy">Economía</div>
      <div class="coach-nav-item" data-view="inbox" style="display:flex; align-items:center; gap:6px;">
        Bandeja
        <span id="inboxBadge" class="badge badge-live" style="display:none; font-size:10px; padding:2px 6px;">0</span>
      </div>
    </nav>

    <main class="coach-content" id="viewContent"></main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="config.js"></script>
  <script type="module" src="js/app.js?v=44"></script>
</body>
</html>
